# Configuração do sincronizador
# Mantenha este arquivo na mesma pasta do product-sync.exe

[firebird]
host=localhost
port=3050
database=C:\Sistema\DADOS.FDB
user=SYSDBA
password=COLOQUE_A_SENHA_DO_FIREBIRD
# Charset do banco (acentos). WIN1252 é o mais comum no Firebird 2.5 do Brasil.
charset=WIN1252

[api]
url=https://ceconnect-produtc-webhook.onrender.com
password=COLOQUE_A_SENHA_DA_API

[cliente]
# Nome exato que o agente envia em ?cliente= na busca. Não altere depois de cadastrado.
nome=Moto Peças Central Ltda

[sync]
# Código da empresa no Firebird
empresa=01
# Setores a sincronizar, separados por vírgula. 1 = peças, 2 = serviços.
setores=1
# Tempo entre as execuções
intervalo_minutos=60
# Quantidade de produtos por requisição
lote=500
